name: CI Pipeline - Reto 3

# ==============================================================================
# REQUISITO 1 y 2: TRIGGERS Y FILTROS DE RUTA
# ==============================================================================
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**' # Ignora cambios que solo afecten a la carpeta docs/ (Requisito 2)
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**' # Ignora cambios que solo afecten a la carpeta docs/ (Requisito 2)

jobs:
  # ==============================================================================
  # REQUISITO 3: JOB "CALIDAD" (LINTER)
  # ==============================================================================
  calidad:
    name: Calidad de Código y Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar Linter y verificación de calidad
        run: |
          echo "Ejecutando linter de código..."
          echo "Verificación completada sin advertencias ni errores."

  # ==============================================================================
  # REQUISITO 4: JOB "PRUEBAS" CON MATRIZ
  # ==============================================================================
  pruebas:
    name: Pruebas en Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20'] # Matriz con dos versiones del lenguaje (Requisito 4)

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Ejecutar pruebas unitarias
        run: |
          echo "Ejecutando suite de pruebas en Node.js ${{ matrix.node-version }}..."
          mkdir -p coverage
          echo "Reporte de cobertura generado exitosamente." > coverage/cobertura.txt

      - name: Guardar reporte de cobertura temporalmente
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-node-${{ matrix.node-version }}
          path: coverage/

  # ==============================================================================
  # REQUISITO 5 y 6: JOB "EMPAQUETAR" (DEPENDENCIAS Y PUBLICACIÓN DE ARTEFACTOS)
  # ==============================================================================
  empaquetar:
    name: Empaquetar y Publicar Artefactos
    runs-on: ubuntu-latest
    # Requisito 5: Depende de los dos jobs anteriores
    needs: [calidad, pruebas]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Construir y empaquetar aplicación
        run: |
          mkdir -p dist
          echo "Empaquetando artefacto final de producción..." > dist/app.js

      - name: Descargar reporte de cobertura del job de pruebas
        uses: actions/download-artifact@v4
        with:
          name: reporte-cobertura-node-20
          path: coverage/

      # Requisito 6: Publica el artefacto y el reporte de cobertura como salida
      - name: Publicar Artefacto de la Aplicación
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-empaquetado
          path: dist/

      - name: Publicar Reporte de Cobertura Final
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-final
          path: coverage/
